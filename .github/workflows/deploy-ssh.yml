name: Deploy main via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure SSH and deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_PASSPHRASE:?Missing SSH_PASSPHRASE}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]
          umask 077
          ssh_dir="$(mktemp -d)"
          cleanup() {
            if [[ -n "${SSH_AGENT_PID:-}" ]]; then
              ssh-agent -k >/dev/null 2>&1 || true
            fi
            rm -rf -- "$ssh_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          touch "$ssh_dir/known_hosts"
          cat > "$ssh_dir/askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$ssh_dir/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$ssh_dir/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
            ssh-add "$ssh_dir/key" </dev/null
          unset SSH_PASSPHRASE SSH_PRIVATE_KEY
          encoded_path="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          ssh -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$encoded_path' '$GITHUB_SHA'" < scripts/deploy-ssh.sh
