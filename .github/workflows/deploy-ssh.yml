name: Deploy main via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build deployment archive
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/release"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release"
          cp -a public/build "$RUNNER_TEMP/release/public/build"
          find "$RUNNER_TEMP/release" -type f -name '*.sql' -delete
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release" .

      - name: Configure SSH and deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USER:?Missing SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_PASSPHRASE:?Missing SSH_PASSPHRASE}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]
          umask 077
          ssh_dir="$(mktemp -d)"
          cleanup() {
            if [[ -n "${transfer_heartbeat:-}" ]]; then
              kill "$transfer_heartbeat" 2>/dev/null || true
              wait "$transfer_heartbeat" 2>/dev/null || true
            fi
            if [[ -n "${SSH_AGENT_PID:-}" ]]; then
              ssh-agent -k >/dev/null 2>&1 || true
            fi
            rm -rf -- "$ssh_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          touch "$ssh_dir/known_hosts"
          cat > "$ssh_dir/askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$ssh_dir/askpass"
          eval "$(ssh-agent -s)" >/dev/null
          SSH_ASKPASS="$ssh_dir/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 \
            ssh-add "$ssh_dir/key" </dev/null
          unset SSH_PASSPHRASE SSH_PRIVATE_KEY
          encoded_path="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          ssh_options=(-p 5022 -i "$ssh_dir/key" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=20
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$SSH_USER@$SSH_HOST"
          echo 'Preparing remote staging directory (maximum 60 seconds)...'
          remote_stage="$(timeout 60s ssh -T "${ssh_options[@]}" "$target" 'mktemp -d /tmp/crou-release.XXXXXXXX')"
          [[ "$remote_stage" =~ ^/tmp/crou-release\.[a-zA-Z0-9]+$ ]]
          # The staging directory is private and outside the document root.
          echo "Uploading archive: $(du -h "$RUNNER_TEMP/release.tar.gz" | cut -f1) (maximum 10 minutes)..."
          (while sleep 15; do echo 'SSH archive upload still running...'; done) &
          transfer_heartbeat=$!
          if timeout 10m ssh -T "${ssh_options[@]}" "$target" "cat > '$remote_stage/release.tar.gz'" < "$RUNNER_TEMP/release.tar.gz"; then
            kill "$transfer_heartbeat" 2>/dev/null || true
            wait "$transfer_heartbeat" 2>/dev/null || true
            unset transfer_heartbeat
          else
            status=$?
            echo "Archive upload failed (exit $status; 124 means timeout)." >&2
            exit "$status"
          fi
          echo 'Archive uploaded. Preparing application deployment...'
          if [[ -n "$ENV_PRODUCTION" ]]; then
            printf '%s\n' "$ENV_PRODUCTION" | ssh -T "${ssh_options[@]}" "$target" "umask 077; cat > '$remote_stage/production.env'"
          fi
          unset ENV_PRODUCTION
          echo 'Executing remote installation and migrations...'
          ssh -T "${ssh_options[@]}" "$target" \
            "bash -s -- '$encoded_path' '$GITHUB_SHA' '$remote_stage'" < scripts/deploy-ssh.sh
